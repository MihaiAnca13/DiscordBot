name: discordbot-webui-dev
services:
  webui:
    build:
      context: .
      dockerfile: dev/webui/Dockerfile
    command: ["python", "-m", "dev.webui.reload"]
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/games', timeout=3)"]
      interval: 2s
      timeout: 5s
      start_period: 90s
      retries: 30
    volumes:
      - ./webui:/app/webui
      - ./Buttons:/app/Buttons
      - ./commands:/app/commands
      - ./helpers:/app/helpers
      - ./listeners:/app/listeners
      - ./setup:/app/setup
      - ./dev:/app/dev
      - ./config.py:/app/config.py
      - webui-sandbox:/sandbox
      - webui-feed:/app/webui/data
      - ./dev/webui/artifacts:/app/dev/webui/artifacts
volumes:
  webui-sandbox:
  webui-feed:
