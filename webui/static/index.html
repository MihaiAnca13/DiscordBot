<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eclipse — table</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="left">
      <label for="game">Game</label>
      <select id="game"></select>
      <label for="seat">Playing as</label>
      <select id="seat"></select>
    </div>
    <div class="right">
      <span id="status"></span>
      <label class="toggle">
        <input type="checkbox" id="mirror"> mirror to Discord
      </label>
      <button id="turn-menu" class="ghost">Show my turn menu</button>
    </div>
  </header>

  <main>
    <section class="board">
      <img id="board" alt="board">
      <div id="board-note" class="note"></div>
    </section>
    <section class="feed">
      <div id="banner" class="banner"></div>
      <div id="messages"></div>
    </section>
  </main>

  <div id="error" class="error"></div>
  <script src="/static/app.js"></script>
</body>
</html>
